apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: release-pipeline
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: This is a system-generated parameter and is required for use in application releases. Refer to https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest for the expected format
metadata:
  stages/v1alpha1:
    - name: Deploy to Dev
      jobs:
        - dev
    - name: Deploy to Staging
      jobs:
        - staging
    - name: Deploy to Prod
      jobs:
        - production
        - test-backend
        - test-frontend
jobs:
  test-backend:
    needs:
      - staging
    steps:
      - name: Checkout backend
        uses: cloudbees-io/checkout@v1
        with:
          repository: dnarlakanti-IN-297/ecommerce-backend
          ref: main

      - name: Run backend tests
        uses: docker://python:3.11-slim
        shell: sh
        run: |
          pip install --no-cache-dir -r requirements.txt
          echo "🧪 Running backend test suite..."
          pytest tests/ \
            -v \
            -o junit_family=legacy \
            --junit-xml=test-results.xml \
            --cov=app \
            --cov=feature_flags \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term || true

          if [ ! -f test-results.xml ]; then
            echo "❌ test-results.xml NOT generated - tests did not run!"
            exit 1
          fi

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: JUNIT
          results-path: test-results.xml

      - name: Extract test summary
        id: test-summary
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache grep
          TOTAL=$(grep -oP 'tests="\K[0-9]+' test-results.xml || echo "0")
          FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml || echo "0")
          ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results.xml || echo "0")
          PASSED=$((TOTAL - FAILURES - ERRORS))
          echo "$TOTAL" > $CLOUDBEES_OUTPUTS/TOTAL_TESTS
          echo "$PASSED" > $CLOUDBEES_OUTPUTS/PASSED_TESTS
          echo "$FAILURES" > $CLOUDBEES_OUTPUTS/FAILED_TESTS

      - name: Publish test evidence
        uses: ./.cloudbees/components/publish-test-evidence
        with:
          total-tests: ${{ steps.test-summary.outputs.TOTAL_TESTS }}
          passed-tests: ${{ steps.test-summary.outputs.PASSED_TESTS }}
          failed-tests: ${{ steps.test-summary.outputs.FAILED_TESTS }}

  test-frontend:
    needs:
      - staging
    steps:
      - name: Checkout frontend
        uses: cloudbees-io/checkout@v1
        with:
          repository: dnarlakanti-IN-297/ecommerce-frontend
          ref: main

      - name: Run frontend tests
        uses: docker://python:3.11-slim
        shell: sh
        run: |
          pip install --no-cache-dir -r requirements.txt
          echo "🧪 Running frontend test suite..."
          pytest tests/ \
            -v \
            -o junit_family=legacy \
            --junit-xml=test-results.xml \
            --cov=app \
            --cov=feature_flags \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term || true

          if [ ! -f test-results.xml ]; then
            echo "❌ test-results.xml NOT generated - tests did not run!"
            exit 1
          fi

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: JUNIT
          results-path: test-results.xml

      - name: Extract test summary
        id: test-summary
        uses: docker://alpine:latest
        shell: sh
        run: |
          apk add --no-cache grep
          TOTAL=$(grep -oP 'tests="\K[0-9]+' test-results.xml || echo "0")
          FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml || echo "0")
          ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results.xml || echo "0")
          PASSED=$((TOTAL - FAILURES - ERRORS))
          echo "$TOTAL" > $CLOUDBEES_OUTPUTS/TOTAL_TESTS
          echo "$PASSED" > $CLOUDBEES_OUTPUTS/PASSED_TESTS
          echo "$FAILURES" > $CLOUDBEES_OUTPUTS/FAILED_TESTS

      - name: Publish test evidence
        uses: ./.cloudbees/components/publish-test-evidence
        with:
          total-tests: ${{ steps.test-summary.outputs.TOTAL_TESTS }}
          passed-tests: ${{ steps.test-summary.outputs.PASSED_TESTS }}
          failed-tests: ${{ steps.test-summary.outputs.FAILED_TESTS }}

  staging:
    needs:
      - dev
    environment: staging
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: staging
    secrets: inherit
    vars: inherit
  production:
    needs:
      - staging
    environment: production
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: prod
    secrets: inherit
    vars: inherit
  dev:
    environment: dev
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
    secrets: inherit
    vars: inherit
