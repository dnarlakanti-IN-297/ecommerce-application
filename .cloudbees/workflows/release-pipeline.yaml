apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: release-pipeline
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: This is a system-generated parameter and is required for use in application releases. Refer to https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest for the expected format
      kubeconfig:
        type: string
        required: true
        description: Kubernetes config for cluster access
      dev-image-tag-override:
        type: string
        required: false
        description: "Optional. Deploy this exact tag to dev instead of the release manifest's version."
      staging-image-tag-override:
        type: string
        required: false
        description: "Optional. Deploy this exact tag to staging instead of the release manifest's version."
      prod-image-tag-override:
        type: string
        required: false
        description: "Optional. Deploy this exact tag to prod instead of the release manifest's version."
metadata:
  stages/v1alpha1:
    - name: Deploy to Dev
      jobs:
        - dev
    - name: Deploy to Staging
      jobs:
        - staging
    - name: Deploy to Prod
      jobs:
        - production
jobs:
  staging:
    needs:
      - dev
    environment: staging
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: staging
      kubeconfig: ${{ inputs.kubeconfig }}
      image-tag-override: ${{ inputs.staging-image-tag-override }}
    secrets: inherit
    vars: inherit
  production:
    needs:
      - staging
    environment: production
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: prod
      kubeconfig: ${{ inputs.kubeconfig }}
      image-tag-override: ${{ inputs.prod-image-tag-override }}
    secrets: inherit
    vars: inherit
  dev:
    environment: dev
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
      kubeconfig: ${{ inputs.kubeconfig }}
      image-tag-override: ${{ inputs.dev-image-tag-override }}
    secrets: inherit
    vars: inherit
