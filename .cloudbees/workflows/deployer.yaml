apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true
      kubeconfig:
        type: string
        required: true
      image-tag-override:
        type: string
        required: false
        description: "Optional. If set, deploy this exact Docker Hub tag (e.g. a git SHA) to every component in this environment. Leave blank to deploy 'latest', same as before this input existed. NOTE: the release manifest's per-component 'id' is a CloudBees-internal artifact identifier, not a Docker tag, and cannot be used directly as image.tag - see https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases"

jobs:
  deploy-database:
    if: ${{ fromJSON(inputs.manifest)['ecommerce-database'].deploy }}
    uses: dnarlakanti-IN-297/ecommerce-database/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ inputs.image-tag-override || 'latest' }}
      environment: ${{ inputs.environment }}
      kubeconfig: ${{ inputs.kubeconfig }}
    secrets: inherit
    vars: inherit

  deploy-backend:
    needs: deploy-database
    if: ${{ fromJSON(inputs.manifest)['ecommerce-backend'].deploy }}
    uses: dnarlakanti-IN-297/ecommerce-backend/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ inputs.image-tag-override || 'latest' }}
      environment: ${{ inputs.environment }}
      kubeconfig: ${{ inputs.kubeconfig }}
    secrets: inherit
    vars: inherit

  deploy-frontend:
    needs: deploy-backend
    if: ${{ fromJSON(inputs.manifest)['ecommerce-frontend'].deploy }}
    uses: dnarlakanti-IN-297/ecommerce-frontend/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ inputs.image-tag-override || 'latest' }}
      environment: ${{ inputs.environment }}
      kubeconfig: ${{ inputs.kubeconfig }}
    secrets: inherit
    vars: inherit
